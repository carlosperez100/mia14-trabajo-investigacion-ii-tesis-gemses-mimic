# Configuración única del pipeline (Sprint 1).
# Las rutas externas (datos bajo DUA) van en .env; aquí solo parámetros.

semilla: 42

ingesta:
  # Fuentes crudas (se registran con hash; NO se copian: DUA PhysioNet y tamaño)
  crudas:
    diagnoses_icd: "${MIMIC_DIR}/hosp/diagnoses_icd.csv.gz"
    discharge: "${MIMIC_NOTE_DIR}/discharge.csv.gz"
  # Etiquetas producidas por las fases 3 v2, 8 y 7 de la tesis (se copian a data/interim)
  etiquetas:
    a1_tier_a: "${ETIQUETAS_DIR}/fase3_v2/candidatos_tier_a_corregido.csv"
    equivalencias_cm: "${ETIQUETAS_DIR}/fase8_equivalencias/positivos_con_equivalencias.csv"
    positivos_cie9: "${ETIQUETAS_DIR}/fase7_epoca/positivos_ambas_epocas.csv"

preprocesado:
  razon_negativos: 2        # negativos por positivo, emparejados por época CIE
  n_max: 70000              # techo por memoria (15.6 GB)
  largo_min_texto: 100      # caracteres; notas más cortas se descartan
  test_size: 0.20           # partición por paciente (GroupShuffleSplit)

baseline:
  n_bootstrap: 200
  logistica:
    max_features: 20000
    C: 1.0
  referencia_fase9:         # configuración del modelo final de la tesis
    palabra_max_features: 60000
    caracter_max_features: 20000

feature_engineering:        # Sprint 2, semana 5: ablación A, A+B, A+C, A+B+C (src/features.py)
  n_folds: 5                # StratifiedGroupKFold por paciente, solo en train
  n_bootstrap: 200          # IC 95 % de la PR-AUC en test, remuestreando pacientes
  logistica:                # mismo modelo del baseline; no se ajustan hiperparámetros en este avance
    C: 1.0
  A:                        # texto: palabras sueltas (idéntico al baseline)
    max_features: 20000
    min_df: 3
  B:                        # transformación del texto: bigramas de palabras
    max_features: 20000
    min_df: 3
  C:                        # dominio y contexto
    winsor: [1, 99]         # percentiles de train para winsorizar log1p(largo)
    min_frecuencia: 50      # categorías con menos casos en train -> «infrecuentes»
    grupos: [nota, paciente, servicio, hospital, atencion]   # ver src/variables_dominio.py
    grupos_escalera: [paciente, servicio, hospital, atencion, nota]   # análisis sin texto: se suma un grupo a la vez

hiperparametros:            # Sprint 3, semana 7: búsqueda aleatoria y bayesiana (src/experimentos_hp.py)
  modelo: A+B+C             # bloques de la semana 5 (src/features.py), sin cambios de diseño
  variante: D2              # filas de entrenamiento de la semana 6 (src/variantes_datos.py)
  # configuración actual = la de feature_engineering: A y B con 20 000 términos y min_df 3, sublinear_tf, C 1.0 y balanced
  n_folds_busqueda: 3       # StratifiedGroupKFold por paciente, solo en train, para buscar
  n_folds_confirmacion: 5   # los 5 folds del proyecto (semanas 5 y 6), para confirmar la mejor frente a la actual
  n_ensayos: 15             # por método, el mismo para la búsqueda aleatoria y la bayesiana. Se fijó primero en 18 y se bajó a 15
                            # antes de la búsqueda, por una estimación previa de que con C alto un ensayo tarda varios minutos
                            # (logs/experimentos_hp_20261028_081924.log registra los 18)
  ensayos_iniciales_tpe: 5  # la bayesiana (TPE) empieza con 5 ensayos al azar y después aprende de los anteriores
  tpe_multivariado: true    # TPE multivariado. Es el valor por defecto de Optuna 5.0.0 con un solo objetivo (multivariate=None),
                            # que usó la corrida del 28-10-2026; se hizo explícito después y la secuencia se verificó idéntica
  n_bootstrap: 200          # IC 95 % de la PR-AUC en test, remuestreando pacientes
  espacio:
    C: [0.001, 100.0]                              # regresión logística, log-uniforme
    A_max_features: [10000, 20000, 40000, 60000]   # 60 000: palabras del modelo de la tesis (baseline.referencia_fase9)
    A_min_df: [2, 3, 5]
    B_max_features: [10000, 20000, 40000]
    B_min_df: [2, 3, 5]
    class_weight: [balanced, ninguno]
    sublinear_tf: [true, false]                    # el mismo valor en los bloques A y B
  regla:                    # prerregistrada antes de correr la búsqueda (validación cruzada de 5 folds)
    folds_mejores_minimo: 4         # la ajustada debe superar a la actual en al menos 4 de los 5 folds
    desviaciones_minimas: 1.0       # y la mejora media debe superar 1 desviación estándar de las diferencias por fold

importancia:                # Sprint 3, semana 7: importancia de variables (src/importancia_variables.py)
  # modelo: la configuración vigente (D2, A+B+C, C 1, A y B con 20 000 términos y min_df 3, balanced, sublinear_tf)
  particion: confirmacion   # los 5 folds del proyecto dentro de train (los de las semanas 5 a 7); no se usa test
  n_repeticiones: 30        # permutaciones por grupo de atributos y por fold
  top_terminos: 20          # top de coeficientes por fold con el que se mide la estabilidad entre folds
  candidatos_por_fold: 50   # términos por signo, bloque y fold que pasan al filtro de privacidad
  mostrar_terminos: 15      # términos por signo y bloque que se publican, ya filtrados
  filtro_privacidad:        # licencia de PhysioNet: se aplica antes de mostrar o guardar cualquier término
    min_pacientes: 100      # pacientes distintos de train con el término en su epicrisis
    min_pct_notas: 1.0      # % de epicrisis de train con el término (precedente del EDA de la semana 4, src/eda_texto.py)
    solo_letras: true       # sin dígitos ni el marcador de anonimización ___ (cada palabra solo con letras a-z)
    max_pct_mayuscula_inicial: 50   # posible nombre propio: alguna palabra del término va con mayúscula inicial en más de este %
    muestra_mayusculas: 10000       # epicrisis de train (al azar, semilla 42) en las que se mide el uso de mayúsculas
