# Configuración única del pipeline (Sprint 1).
# Las rutas externas (datos bajo DUA) van en .env; aquí solo parámetros.

semilla: 42

ingesta:
  # Fuentes crudas (se registran con hash; NO se copian: DUA PhysioNet y tamaño)
  crudas:
    diagnoses_icd: "${MIMIC_DIR}/hosp/diagnoses_icd.csv.gz"
    discharge: "${MIMIC_NOTE_DIR}/discharge.csv.gz"
  # Etiquetas producidas por las fases 3 v2, 8 y 7 de la tesis (se copian a data/interim)
  etiquetas:
    a1_tier_a: "${ETIQUETAS_DIR}/fase3_v2/candidatos_tier_a_corregido.csv"
    equivalencias_cm: "${ETIQUETAS_DIR}/fase8_equivalencias/positivos_con_equivalencias.csv"
    positivos_cie9: "${ETIQUETAS_DIR}/fase7_epoca/positivos_ambas_epocas.csv"

preprocesado:
  razon_negativos: 2        # negativos por positivo, emparejados por época CIE
  n_max: 70000              # techo por memoria (15.6 GB)
  largo_min_texto: 100      # caracteres; notas más cortas se descartan
  test_size: 0.20           # partición por paciente (GroupShuffleSplit)

baseline:
  n_bootstrap: 200
  logistica:
    max_features: 20000
    C: 1.0
  referencia_fase9:         # configuración del modelo final de la tesis
    palabra_max_features: 60000
    caracter_max_features: 20000

feature_engineering:        # Sprint 2, semana 5: ablación A, A+B, A+C, A+B+C (src/features.py)
  n_folds: 5                # StratifiedGroupKFold por paciente, solo en train
  n_bootstrap: 200          # IC 95 % de la PR-AUC en test, remuestreando pacientes
  logistica:                # mismo modelo del baseline; no se ajustan hiperparámetros en este avance
    C: 1.0
  A:                        # texto: palabras sueltas (idéntico al baseline)
    max_features: 20000
    min_df: 3
  B:                        # transformación del texto: bigramas de palabras
    max_features: 20000
    min_df: 3
  C:                        # dominio y contexto
    winsor: [1, 99]         # percentiles de train para winsorizar log1p(largo)
    min_frecuencia: 50      # categorías con menos casos en train -> «infrecuentes»
    grupos: [nota, paciente, servicio, hospital, atencion]   # ver src/variables_dominio.py
    grupos_escalera: [paciente, servicio, hospital, atencion, nota]   # análisis sin texto: se suma un grupo a la vez

hiperparametros:            # Sprint 3, semana 7: búsqueda aleatoria y bayesiana (src/experimentos_hp.py)
  modelo: A+B+C             # bloques de la semana 5 (src/features.py), sin cambios de diseño
  variante: D2              # filas de entrenamiento de la semana 6 (src/variantes_datos.py)
  # configuración actual = la de feature_engineering: A y B con 20 000 términos y min_df 3, sublinear_tf, C 1.0 y balanced
  n_folds_busqueda: 3       # StratifiedGroupKFold por paciente, solo en train, para buscar
  n_folds_confirmacion: 5   # los 5 folds del proyecto (semanas 5 y 6), para confirmar la mejor frente a la actual
  n_ensayos: 15             # por método, el mismo para la búsqueda aleatoria y la bayesiana. Se fijó primero en 18 y se bajó a 15
                            # antes de la búsqueda, por una estimación previa de que con C alto un ensayo tarda varios minutos
                            # (logs/experimentos_hp_20261028_081924.log registra los 18)
  ensayos_iniciales_tpe: 5  # la bayesiana (TPE) empieza con 5 ensayos al azar y después aprende de los anteriores
  tpe_multivariado: true    # TPE multivariado. Es el valor por defecto de Optuna 5.0.0 con un solo objetivo (multivariate=None),
                            # que usó la corrida del 28-10-2026; se hizo explícito después y la secuencia se verificó idéntica
  n_bootstrap: 200          # IC 95 % de la PR-AUC en test, remuestreando pacientes
  espacio:
    C: [0.001, 100.0]                              # regresión logística, log-uniforme
    A_max_features: [10000, 20000, 40000, 60000]   # 60 000: palabras del modelo de la tesis (baseline.referencia_fase9)
    A_min_df: [2, 3, 5]
    B_max_features: [10000, 20000, 40000]
    B_min_df: [2, 3, 5]
    class_weight: [balanced, ninguno]
    sublinear_tf: [true, false]                    # el mismo valor en los bloques A y B
  regla:                    # prerregistrada antes de correr la búsqueda (validación cruzada de 5 folds)
    folds_mejores_minimo: 4         # la ajustada debe superar a la actual en al menos 4 de los 5 folds
    desviaciones_minimas: 1.0       # y la mejora media debe superar 1 desviación estándar de las diferencias por fold

hiperparametros_pruning:    # Sprint 3, semana 8: la búsqueda de la semana 7 con pruning, más ensayos y artefactos
                            # (src/experimentos_hp_pruning.py), según la lámina 21 del material de la semana 7. Se escribió antes de
                            # correr la búsqueda. Mismo modelo (D2 con A+B+C), mismo espacio, mismos 3 folds y misma semilla (42)
  n_ensayos: 30             # por método: el mínimo de la lámina 13 (de 30 a 100 ensayos, según el costo); la semana 7 usó 15
  ensayos_iniciales_tpe: 10 # ensayos al azar antes de que el TPE aprenda (la lámina 7 sugiere de 10 a 20; la semana 7 usó 5)
  pruner:                   # optuna.pruners.MedianPruner: corta el ensayo si su mejor valor intermedio queda por debajo de la
                            # mediana de los ensayos completos de la misma búsqueda en el mismo fold
    n_startup_trials: 5     # no corta hasta que la búsqueda tenga 5 ensayos completos
    n_warmup_steps: 0       # puede cortar desde el primer fold
    interval_steps: 1       # revisa después de cada fold
  # valor intermedio que se informa después de cada fold: la PR-AUC media de los folds ya evaluados
  max_segundos_por_ensayo: 600   # después de cada fold, corta el ensayo si ya superó este tiempo (el más lento de la semana 7: 510 s)
  max_minutos_por_busqueda: 240  # límite total de cada búsqueda (timeout de Optuna): pasado ese tiempo no empieza ensayos nuevos
  n_respaldo: 2             # configuraciones de respaldo: las 2 de mayor PR-AUC media en 3 folds, distintas de la ganadora, entre
                            # los ensayos completos de las cuatro búsquedas (semanas 7 y 8); se confirman con los 5 folds del proyecto
  importancia_min_sobre_cuantil: 5   # importancia de los hiperparámetros con el evaluador por defecto de Optuna 5.0.0 (PED-ANOVA) sobre
                                     # los ensayos completos de las cuatro búsquedas; el cuantil objetivo se ajusta para dejar al menos
                                     # 5 ensayos sobre él, como recomienda la documentación de Optuna
  curva_fracciones: [0.1, 0.25, 0.5, 1.0]   # curva de aprendizaje de la ganadora: fracción de las filas de entrenamiento de cada uno
                                             # de los 5 folds del proyecto (muestra al azar, semilla 42 + n.º de fold)
  # Regla de decisión: la misma de la semana 7 (hiperparametros.regla). La candidata es la configuración con mayor PR-AUC media
  # entre los ensayos completos de las dos búsquedas con pruning, y se confirma frente a la actual con los 5 folds del proyecto.
  # El test se mide una sola vez y solo si la regla adopta la candidata (lámina 14: no optimizar mirando el test).
  # Artefactos: la ganadora y los respaldos se reentrenan con todo train (filas de D2) y se guardan en models/ (fuera de git,
  # porque el vocabulario sale de las notas de MIMIC-IV), con su hash en reportes/hp_pruning_resultados.json.

importancia:                # Sprint 3, semana 7: importancia de variables (src/importancia_variables.py)
  # modelo: la configuración vigente (D2, A+B+C, C 1, A y B con 20 000 términos y min_df 3, balanced, sublinear_tf)
  particion: confirmacion   # los 5 folds del proyecto dentro de train (los de las semanas 5 a 7); no se usa test
  n_repeticiones: 30        # permutaciones por grupo de atributos y por fold
  top_terminos: 20          # top de coeficientes por fold con el que se mide la estabilidad entre folds
  candidatos_por_fold: 50   # términos por signo, bloque y fold que pasan al filtro de privacidad
  mostrar_terminos: 15      # términos por signo y bloque que se publican, ya filtrados
  filtro_privacidad:        # licencia de PhysioNet: se aplica antes de mostrar o guardar cualquier término
    min_pacientes: 100      # pacientes distintos de train con el término en su epicrisis
    min_pct_notas: 1.0      # % de epicrisis de train con el término (precedente del EDA de la semana 4, src/eda_texto.py)
    solo_letras: true       # sin dígitos ni el marcador de anonimización ___ (cada palabra solo con letras a-z)
    max_pct_mayuscula_inicial: 50   # posible nombre propio: alguna palabra del término va con mayúscula inicial en más de este %
    muestra_mayusculas: 10000       # epicrisis de train (al azar, semilla 42) en las que se mide el uso de mayúsculas

he1_estratos:               # Sprint 3: HE1 por estratos (script por escribir). Prerregistro escrito el 05-11-2026, antes de calcular la
                            # ROC-AUC de cualquier estrato. El diseño es el de la HE1 en la matriz de consistencia v4 (02-11-2026)
  modelo: A+B+C             # el «modelo adoptado» de la matriz v4, entrenado con las filas de train de la variante D2
  variante: D2
  comparador: C             # el modelo de contexto sin texto (bloque C), entrenado con las mismas filas
  configuracion:            # la actual: la de feature_engineering, la del lote de la revisión ciega (README, semana 7) y la del «modelo
                            # adoptado» de la matriz v4 (ver la razón 2 de la decisión)
    C: 1.0
    A_max_features: 20000
    A_min_df: 3
    B_max_features: 20000
    B_min_df: 3
    class_weight: balanced
    sublinear_tf: true
  # Decisión del 05-11-2026: la HE1 se evalúa con la configuración actual y no con la candidata de la semana 8 (bayesiana #25), que la
  # regla prerregistrada adoptó con una mejora media de +0.0014 en la PR-AUC de los 5 folds. Razones:
  #  1) la hipótesis general se considera cumplida si se cumplen a la vez HE1, HE2 y HE3, y el lote de la revisión ciega de HE2 y HE3
  #     se generó con la configuración actual y no se regenera (README, semana 7), de modo que las tres se refieren a la misma configuración;
  #  2) la HE1 se formula sobre el «modelo adoptado» de la matriz v4, cuya nota da una ROC-AUC de 0.871 sin etiqueta dudosa y de 0.840 con
  #     todas las epicrisis de prueba. Derivación: la matriz v4 se guardó el 02-11-2026 a las 12:08 (fecha de modificación del .docx y
  #     del .pdf), antes de que empezara la corrida de la semana 8 (13:14, logs/experimentos_hp_pruning_20261102_131402.log), y 0.871 es
  #     la ROC-AUC de la actual (0.8706), mientras que la candidata da 0.8699, que redondea a 0.870. Por tanto, ese modelo ya era la
  #     configuración actual antes de que existiera la candidata;
  #  3) a criterio del autor, la actual es más parsimoniosa: 40 091 atributos frente a 91 296 en el fold 1 de la confirmación con 5 folds.
  # La ROC-AUC de test no es una razón de la elección, porque el test no se usa para optimizar (hiperparametros_pruning). Solo muestra
  # que la diferencia global es mínima, 0.8706 con la actual y 0.8699 con la candidata sin etiqueta dudosa, y la candidata queda como
  # análisis de sensibilidad.
  particion: test           # los modelos se entrenan con train y se evalúan en test
  etiqueta: sin_dudosa      # análisis principal: las 12 321 epicrisis de prueba sin etiqueta dudosa
  estratos:
    servicio_ingreso: servicio     # el primer curr_service de hosp/services según transfertime (src/eda_variables.py)
    grupo_edad: ["18 a 44", "45 a 64", "65 a 79", "80 o más"]   # años, con los cortes de src/eda_variables.py
    decil_largo: 10                # deciles del largo de la nota en caracteres (src/eda.py), calculados en la partición de prueba
  min_epicrisis_estrato: 200       # solo se evalúan los estratos con 200 epicrisis o más
  min_por_clase: 30                # y con al menos 30 de cada clase
  criterio: limite_inferior_ic95_mayor_que_cero   # en cada estrato evaluable, el límite inferior del IC 95 % por paciente de la
                                                  # diferencia de ROC-AUC (A+B+C menos C) es mayor que cero, es decir, el IC no incluye
                                                  # el cero, y la HE1 se cumple si eso ocurre en todos los estratos evaluables (matriz
                                                  # v4, indicador de la HE1; decisión 3 del EDA en src/eda.py)
  sensibilidad:
    todas_las_epicrisis: true      # las 14 085 epicrisis de prueba con la etiqueta original (matriz v4)
    configuracion_candidata:       # la candidata de la semana 8 que la regla adoptó, bayesiana #25 (reportes/hp_pruning_resultados.json)
      C: 1.8734194377493316
      A_max_features: 60000
      A_min_df: 3
      B_max_features: 40000
      B_min_df: 5
      class_weight: ninguno
      sublinear_tf: true
  # Pendiente de definir antes de calcular, dado que la matriz v4 no lo fija:
  #  - el número de remuestreos por paciente del IC 95 % (feature_engineering e hiperparametros usan 200);
  #  - si el remuestreo es pareado (los mismos pacientes para A+B+C y para C en cada remuestreo) y si el IC es por percentiles, como el
  #    del modelo de contexto del EDA (src/eda_variables.py);
  #  - si los cortes de los deciles salen de las 14 085 epicrisis de prueba o de las 12 321 sin etiqueta dudosa;
  #  - si los mínimos de 200 epicrisis y 30 por clase se cuentan de nuevo en cada análisis de sensibilidad;
  #  - el bloque C de la sensibilidad con la candidata: con la regresión logística de la actual (C 1.0, balanced) o con la de la candidata.

he1_enmienda_1:             # Enmienda 1 de he1_estratos (fda6828), registrada el 12-11-2026, antes de ejecutar el script de la HE1 y
                            # antes de abrir los resultados de la revisión ciega. Texto completo: docs/enmienda_1_prerregistro.md
                            # Redacción del 13-11-2026 alineada al plan de tesis, con la clave del proceso renombrada;
                            # los criterios y los valores no cambian (texto registrado: commit ad116a5).
  criterio: global          # el criterio por estrato de he1_estratos pasa a sensibilidad
  analisis_principal: sin_dudosa                 # las 12 321 epicrisis de prueba sin etiqueta dudosa
  diferencia_minima_roc_auc: 0.05                # umbral sin fuente; se informa el IC completo (A+B+C menos C)
  limite_inferior_ic95_mayor_que: 0.0            # IC 95 % por paciente de la diferencia global
  estabilidad:
    semillas: [43, 44, 45, 46, 47]               # cinco particiones por paciente adicionales (42 + n.º de partición)
    criterio: limite_inferior_ic95_mayor_que_cero_en_todas   # ambos modelos se reentrenan en cada partición
  ic95:
    metodo: percentiles
    remuestreos_pacientes: 2000
    pareado: true                                # los mismos pacientes para A+B+C y para C en cada remuestreo
  deciles_largo: por_analisis                    # cortes en el conjunto de prueba de cada análisis (12 321 o 14 085)
  minimos_por_analisis: true                     # 200 epicrisis y 30 por clase, contados de nuevo en cada sensibilidad
  bloque_c_con_candidata: regresion_de_la_candidata   # C 1.8734 y sin pesos, igual que la candidata
  hipotesis_general: [HE1, HE2]                  # la HE2 de la matriz v4 (VPP) pasa a resultado descriptivo del OE2, sin umbral; la HE3 de la v4 es la HE2
  decision_confirmatoria: HE2                    # la HE1 no es ciega respecto de su dirección (0.864, 0.760 y 0.8706 conocidos)
  he2_margen_ausencia_diferencia: 0.10           # si la HE2 no se cumple, se descarta una diferencia de 0.10 o mayor solo si el límite
                                                 # superior del IC 95 % de Newcombe es menor que 0.10; si no, no concluyente
  adjudicacion: prevalece_segundo_evaluador      # si hay segunda lectura, en las 100 previstas: consenso sin conocer la marca; sin acuerdo, el 2.º
  segundo_evaluador:
    credencial_hasta: 2026-11-30                 # si no la tiene, se invita a otro evaluador clínico con credencial propia
    sin_kappa_si_nadie_al: 2026-12-31            # entonces la referencia es la lectura del investigador en las 241
  proceso_gemses: Hospitalizacion                # num. 19.6; el servicio al ingreso, como aproximación al del num. 19.7, es atributo y sensibilidad
  cortes_impacto: enmienda_2                     # se registran antes de abrir los resultados de la revisión ciega
